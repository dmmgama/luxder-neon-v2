<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Luxder">
<meta name="theme-color" content="#0B0A16">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦆</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230B0A16'/><text y='.9em' font-size='80' x='8'>🦆</text></svg>">
<title>Luxder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800&family=Rubik+Mono+One&family=Rubik:wght@500;800&display=swap">
<style>
:root{
  --ink:#0B0A16; --card:#17152B; --line:#2A2745; --cream:#FFF4DC; --muted:#A9A4C7;
  --a:#FF4FA3; --b:#C9FF3A; --c:#5EE3FF; --d:#FFC63A; --ash:#5a1236; --dsh:#5a3a08;
  --display:'Bangers',Impact,'Arial Black',sans-serif; --body:'Nunito','Segoe UI',system-ui,sans-serif;
  --r:22px; --bg1:#2a1440; --bg2:#0d2a3a; --shadow:0 6px 0 #00000080;
  --aG1:rgba(255,79,163,.25); --aG2:rgba(255,79,163,.45); --bG1:rgba(201,255,58,.25); --bG2:rgba(201,255,58,.55); --bPad:#2f3a1c; --tagA:#2b1636; --tagB:#1f2a0b;
}
.pop{
  --ink:#1B2CFF; --card:#1120D6; --line:#0A12A0; --cream:#FFFFFF; --muted:#C9CEFF;
  --a:#FF6A00; --b:#F5FF00; --c:#FFFFFF; --d:#F5FF00; --ash:#7a2a00; --dsh:#5a5a00;
  --display:'Rubik Mono One','Arial Black',Impact,sans-serif; --body:'Rubik','Segoe UI',system-ui,sans-serif;
  --r:999px; --bg1:#3a4bff; --bg2:#0a10a0; --shadow:0 6px 0 #000;
  --aG1:rgba(255,106,0,.3); --aG2:rgba(255,106,0,.5); --bG1:rgba(245,255,0,.3); --bG2:rgba(245,255,0,.6); --bPad:#3a44c0; --tagA:#2a1a00; --tagB:#2a2a00;
}
.pop h1,.pop h2{font-size:clamp(26px,7.5vw,36px);line-height:1.05;letter-spacing:0}
.pop button{font-size:clamp(17px,4.6vw,22px);letter-spacing:0;border:3px solid #000}
.pop .big{font-size:clamp(64px,22vw,100px)}
.pop .tag{border-radius:6px;transform:rotate(-2deg);background:var(--b);color:#000;border-color:#000}
.pop .tag.lime{background:var(--a);color:#000}
.pop .card{border-color:#000;box-shadow:6px 6px 0 #000;border-radius:18px}
.pop .top b{color:var(--b);text-shadow:3px 3px 0 #000;font-size:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--body);font-weight:600;padding-block:0;padding-inline:16px;overflow-x:hidden;
  background-image:radial-gradient(ellipse at 20% 0%,var(--bg1) 0,transparent 55%),radial-gradient(ellipse at 90% 100%,var(--bg2) 0,transparent 50%)}
.app{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:env(safe-area-inset-bottom);display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top b{font-family:var(--display);font-size:26px;letter-spacing:.04em;color:var(--a);text-shadow:3px 3px 0 var(--ash);cursor:pointer}
.top .sw{display:flex;gap:6px}
.top .sw button{min-height:0;padding:6px 10px;font-size:12px;font-family:var(--body);font-weight:800;border-radius:999px;background:var(--card);color:var(--cream);border:2px solid var(--line);box-shadow:none;letter-spacing:.06em}
.top .sw button.on{background:var(--b);color:#000;border-color:var(--b)}
.screen{display:none;flex:1;flex-direction:column;gap:14px;padding-block:8px 24px;animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
.screen.on{display:flex}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
h1{font-family:var(--display);font-weight:400;font-size:clamp(38px,10.5vw,52px);line-height:.95;margin:0;letter-spacing:.03em;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,7.5vw,38px);line-height:1;margin:0;letter-spacing:.03em;text-wrap:balance}
p{margin:0;font-size:18px;line-height:1.35}
.small{font-size:13px;color:var(--muted);line-height:1.4}
.center{text-align:center}
.spacer{flex:1}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btns.col{grid-template-columns:1fr}
.btns.three{grid-template-columns:1fr 1fr 1fr}
button{-webkit-appearance:none;appearance:none;touch-action:manipulation;font-family:var(--display);font-size:clamp(22px,6.5vw,30px);letter-spacing:.04em;border:0;border-radius:var(--r);padding:20px 10px;color:#0B0A16;cursor:pointer;min-height:92px;line-height:1;box-shadow:var(--shadow);transition:transform .08s}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #00000080}
button:focus-visible{outline:4px solid var(--c);outline-offset:3px}
button:disabled{opacity:.35}
.yes{background:var(--a)} .no{background:var(--b)}
.ghost{background:var(--card);color:var(--cream);border:3px solid var(--line);box-shadow:none;min-height:60px;font-size:20px;padding:12px}
.card{background:var(--card);border:3px solid var(--line);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:10px}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.opt{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:12px 16px;display:flex;align-items:center;gap:14px;min-height:0;box-shadow:none;color:var(--cream);font-family:var(--body);font-weight:800;font-size:18px;text-align:left}
.opt svg{width:52px;height:52px;flex:none}
.opt:active,.opt.pick{border-color:var(--a)}
.who{font-family:var(--display);font-size:22px;letter-spacing:.05em;color:var(--c)}
.who.f{color:var(--a)} .who.m{color:var(--c)}
.duoav{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duoav .card{align-items:center;text-align:center;padding:12px}
.duoav svg{width:100%;max-width:150px;height:auto}
.duoav .lbl{font-family:var(--display);font-size:20px;letter-spacing:.05em}
.pad{aspect-ratio:1;max-width:250px;width:78%;margin:0 auto;border-radius:50%;background:var(--card);border:6px solid var(--line);display:grid;place-items:center;position:relative;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pad.hot{border-color:var(--a);box-shadow:0 0 0 12px var(--aG1),0 0 60px var(--aG2)}
.pad.go{border-color:var(--b);background:var(--bPad);box-shadow:0 0 0 14px var(--bG1),0 0 80px var(--bG2)}
.pad svg{width:70%;height:70%}
.pad .ring{position:absolute;inset:-6px;border-radius:50%;border:6px solid var(--b);clip-path:inset(0 0 var(--cut,100%) 0);transition:clip-path .05s linear}
.status{font-family:var(--display);font-size:22px;letter-spacing:.04em;color:var(--c);text-align:center;min-height:28px}
.big{font-family:var(--display);font-size:clamp(84px,30vw,140px);line-height:.9;color:var(--d);text-shadow:5px 5px 0 var(--dsh);text-align:center}
.verdict{font-size:20px;text-align:center;line-height:1.35}
.lvl{display:flex;gap:6px}
.lvl i{flex:1;height:10px;border-radius:99px;background:var(--line)} .lvl i.on{background:var(--a)}
.tag{display:inline-block;background:var(--tagA);border:2px solid var(--a);color:var(--a);border-radius:999px;padding:4px 12px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;align-self:flex-start}
.tag.lime{background:var(--tagB);border-color:var(--b);color:var(--b)}
.report{display:grid;grid-template-columns:1fr auto;gap:8px 14px;font-size:17px;align-items:center}
.report b{font-family:var(--display);font-size:24px;color:var(--b);letter-spacing:.04em;font-variant-numeric:tabular-nums;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:3px solid var(--line);border-radius:999px;padding:10px 16px;font-family:var(--display);font-size:20px;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.chip.m{border-color:var(--c);color:var(--c)} .chip.f{border-color:var(--a);color:var(--a)}
.chip button{min-height:0;padding:2px 8px;font-size:16px;background:transparent;color:var(--muted);box-shadow:none;border:0;font-family:var(--body)}
.score{display:grid;gap:8px}
.score .row{display:grid;grid-template-columns:1fr auto;align-items:center;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:10px 14px}
.score .row.lead{border-color:var(--d)}
.score .t{font-family:var(--display);font-size:20px;letter-spacing:.05em}
.score .n{font-family:var(--display);font-size:40px;line-height:1;color:var(--d);font-variant-numeric:tabular-nums}
.timer{font-family:var(--display);font-size:clamp(70px,24vw,110px);line-height:.9;text-align:center;color:var(--b);font-variant-numeric:tabular-nums}
.secret{filter:blur(14px);transition:filter .2s} .secret.show{filter:none}
.bike{font-size:clamp(90px,34vw,150px);text-align:center;line-height:1;animation:ride 1.4s ease-in-out infinite}
@keyframes ride{0%,100%{transform:translateX(-8px) rotate(-3deg)}50%{transform:translateX(8px) rotate(3deg)}}
.daretxt{font-family:var(--display);font-size:clamp(28px,8vw,40px);line-height:1.05;letter-spacing:.03em;color:var(--d);text-align:center}
.prize{color:var(--d);text-align:center;font-size:16px}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){.screen,.bike{animation:none}}
</style>

</head>
<body>
<canvas id="fx"></canvas>
<div class="app">
  <div class="top"><b data-go="s-beta">Luxder</b><div class="sw"><button id="lang-pt" class="on">PT</button><button id="lang-en">EN</button><button id="th-neon" class="on">NÉON</button><button id="th-pop">POP</button></div></div>

  <section class="screen on" id="s-beta">
    <span class="tag" data-i="beta.tag"></span>
    <h1 data-i="beta.h"></h1>
    <p data-i="beta.p"></p>
    <div class="spacer"></div>
    <div class="btns"><button class="yes" data-go="s-q" data-i="beta.yes"></button><button class="no" data-go="s-recusa" data-i="beta.no"></button></div>
    <div class="btns col"><button class="ghost" data-go="s-setup" data-i="beta.game"></button></div>
    <p class="small" data-i="beta.foot"></p>
  </section>

  <section class="screen" id="s-recusa">
    <span class="tag lime" data-i="rec.tag"></span>
    <h1 data-i="rec.h"></h1>
    <p data-i="rec.p"></p>
    <div class="spacer"></div>
    <div class="btns col"><button class="ghost" data-go="s-beta" data-i="rec.btn"></button></div>
  </section>

  <section class="screen" id="s-q">
    <span class="tag" id="qtag"></span>
    <div class="who" id="qwho"></div>
    <h2 id="qtext"></h2>
    <div class="opts" id="opts"></div>
    <p class="small" id="qhint"></p>
  </section>

  <section class="screen" id="s-avatar">
    <span class="tag" data-i="av.tag"></span>
    <div class="duoav">
      <div class="card"><div class="lbl" style="color:var(--c)" data-i="av.them"></div><div id="av-eles"></div></div>
      <div class="card"><div class="lbl" style="color:var(--b)" data-i="av.her"></div><div id="av-ela"></div></div>
    </div>
    <h2 id="avname"></h2>
    <p class="verdict" id="avmsg" style="color:var(--c)"></p>
    <div class="spacer"></div>
    <div class="btns col"><button class="yes" data-go="s-scan" data-i="av.btn"></button></div>
  </section>

  <section class="screen" id="s-scan">
    <span class="tag" data-i="scan.tag"></span>
    <h2 id="scan-title"></h2>
    <div class="pad" id="pad"><div class="ring"></div>
      <svg viewBox="0 0 100 100" fill="none" stroke="var(--a)" stroke-width="4" stroke-linecap="round">
        <path d="M50 18c-18 0-30 13-30 30v10"/><path d="M50 28c-12 0-20 9-20 20v18"/><path d="M50 38c-6 0-10 4-10 10v24"/>
        <path d="M50 48v22"/><path d="M60 38c6 2 10 7 10 14v20"/><path d="M60 26c12 3 20 12 20 24v14"/><path d="M50 18c18 0 30 13 30 30"/>
      </svg></div>
    <div class="status" id="status"></div>
    <p class="small center" data-i="scan.foot"></p>
  </section>

  <section class="screen" id="s-verdict">
    <span class="tag" data-i="v.tag"></span>
    <div class="big" id="pct">73%</div>
    <p class="verdict" id="vtext"></p>
    <p class="small center" data-i="v.src"></p>
    <div class="spacer"></div>
    <p class="small center" data-i="v.ask"></p>
    <div class="btns"><button class="yes" data-go="s-match" data-i="v.ok"></button><button class="no" id="chumbar" data-i="v.fail"></button></div>
  </section>

  <section class="screen" id="s-match">
    <span class="tag" data-i="m.tag"></span>
    <div class="big" style="color:var(--a);text-shadow:5px 5px 0 var(--ash)">97%</div>
    <h2 data-i="m.h"></h2>
    <p data-i="m.p"></p>
    <div class="spacer"></div>
    <div class="btns"><button class="yes" data-go="s-setup" data-i="m.game"></button><button class="ghost" data-go="s-report" data-i="m.rep"></button></div>
  </section>

  <section class="screen" id="s-castigo">
    <span class="tag lime" data-i="c.tag"></span>
    <div class="lvl"><i></i><i></i><i></i></div>
    <h2 id="ctitle"></h2>
    <div class="card"><p id="cwho" style="color:var(--d)"></p><p id="ctext"></p></div>
    <p class="small" id="cmeta"></p>
    <div class="spacer"></div>
    <div class="btns"><button class="yes" data-go="s-scan" data-i="c.done"></button><button class="no" id="chumbar2" data-i="c.again"></button></div>
    <div class="btns col"><button class="ghost" data-go="s-win" data-i="c.won"></button></div>
  </section>

  <section class="screen" id="s-win">
    <span class="tag lime" data-i="w.tag"></span>
    <h1 data-i="w.h"></h1>
    <p data-i="w.p"></p>
    <div class="spacer"></div>
    <div class="btns"><button class="ghost" data-go="s-report" data-i="w.rep"></button><button class="ghost" data-go="s-beta" data-i="w.restart"></button></div>
  </section>

  <section class="screen" id="s-report">
    <span class="tag" data-i="r.tag"></span>
    <h2 data-i="r.h"></h2>
    <div class="card report">
      <span data-i="r.rigor"></span><b>94%</b>
      <span data-i="r.pac"></span><b id="r-pac">12%</b>
      <span data-i="r.bugs"></span><b id="r-bugs">0</b>
      <span data-i="r.acc"></span><b id="r-acc">0%</b>
      <span data-i="r.rec"></span><b data-i="r.recv"></b>
    </div>
    <p class="small" data-i="r.foot"></p>
    <div class="spacer"></div>
    <div class="btns col"><button class="ghost" data-go="s-beta" data-i="r.btn"></button></div>
  </section>

  <!-- ===== JOGO: CORRIDA À BICICLETA ===== -->
  <section class="screen" id="s-setup">
    <span class="tag" data-i="g.tag"></span>
    <h1 data-i="g.h"></h1>
    <p data-i="g.p"></p>
    <div class="chips" id="chips"></div>
    <div class="btns"><button class="ghost" id="add-m" data-i="g.addm"></button><button class="ghost" id="add-f" data-i="g.addf"></button></div>
    <div class="card"><p id="g-mode" style="color:var(--d)"></p><p class="small" id="g-modep"></p></div>
    <div class="spacer"></div>
    <div class="btns col"><button class="yes" id="g-start" disabled data-i="g.start"></button></div>
  </section>

  <section class="screen" id="s-pair">
    <span class="tag" data-i="pr.tag"></span>
    <div class="who" id="pr-who"></div>
    <h2 id="pr-q"></h2>
    <p class="small" id="pr-hint"></p>
    <div class="opts" id="pr-opts"></div>
  </section>

  <section class="screen" id="s-pairs">
    <span class="tag" data-i="prs.tag"></span>
    <h2 data-i="prs.h"></h2>
    <div class="score" id="pairs-list"></div>
    <p class="small" data-i="prs.p"></p>
    <div class="spacer"></div>
    <div class="btns col"><button class="yes" id="prs-go" data-i="prs.btn"></button></div>
  </section>

  <section class="screen" id="s-score">
    <span class="tag" id="sc-tag"></span>
    <div class="score" id="sc-list"></div>
    <h2 id="sc-title"></h2>
    <p class="verdict" id="sc-text"></p>
    <p class="prize" id="sc-prize"></p>
    <div class="spacer"></div>
    <div class="btns col"><button class="yes" id="sc-next" data-i="sc.next"></button></div>
  </section>

  <section class="screen" id="s-reflex">
    <span class="tag" data-i="rf.tag"></span>
    <div class="who" id="rf-who"></div>
    <h2 data-i="rf.h"></h2>
    <div class="pad" id="rfpad"><div class="status" id="rf-status" style="font-size:28px"></div></div>
    <p class="verdict" id="rf-res" style="min-height:52px"></p>
  </section>

  <section class="screen" id="s-guess">
    <span class="tag" id="gs-tag"></span>
    <div class="who" id="gs-who"></div>
    <h2 id="gs-q"></h2>
    <p class="small" id="gs-hint"></p>
    <div class="opts" id="gs-opts"></div>
  </section>

  <section class="screen" id="s-chal">
    <span class="tag" data-i="ch.tag"></span>
    <div class="who" id="ch-who"></div>
    <h2 id="ch-title"></h2>
    <div class="card center"><p class="secret" id="ch-word" style="font-family:var(--display);font-size:30px;letter-spacing:.04em;color:var(--d)"></p></div>
    <div class="timer" id="ch-timer" hidden>20</div>
    <div class="btns col" id="ch-ctl"><button class="ghost" id="ch-reveal" data-i="ch.reveal"></button><button class="yes" id="ch-start" disabled data-i="ch.start"></button></div>
    <div class="btns" id="ch-judge" hidden><button class="yes" id="ch-ok" data-i="ch.ok"></button><button class="no" id="ch-fail" data-i="ch.fail"></button></div>
    <p class="small" id="ch-hint"></p>
  </section>

  <section class="screen" id="s-dare">
    <span class="tag lime" data-i="d.tag"></span>
    <div class="who" id="d-who"></div>
    <div class="card"><p class="daretxt" id="d-text"></p><p class="small center" id="d-sub"></p></div>
    <div class="timer" id="d-timer">10</div>
    <div class="btns col" id="d-ctl"><button class="yes" id="d-start" data-i="d.start"></button></div>
    <div class="btns" id="d-judge" hidden><button class="yes" id="d-ok" data-i="d.ok"></button><button class="no" id="d-fail" data-i="d.fail"></button></div>
    <p class="small center" data-i="d.hint"></p>
  </section>

  <section class="screen" id="s-final">
    <span class="tag lime" data-i="f.tag"></span>
    <div class="bike">🚲</div>
    <h1 id="f-title"></h1>
    <p class="verdict" id="f-prize"></p>
    <div class="card"><p id="f-cwho" style="color:var(--d)"></p><p id="f-ctext"></p></div>
    <p class="small" id="f-note"></p>
    <div class="spacer"></div>
    <div class="btns"><button class="ghost" id="f-again" data-i="f.again"></button><button class="ghost" id="f-prize2" data-i="f.prize2"></button></div>
    <div class="btns col"><button class="yes" id="f-rematch" data-i="f.rematch"></button></div>
    <div class="btns col"><button class="ghost" data-go="s-beta" data-i="f.home"></button></div>
  </section>
</div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
let lang='pt';const L=x=>typeof x==='string'?x:(x[lang]??x.pt);
const B=(pt,en)=>({pt,en});

/* ---------- i18n ---------- */
const I={
 'beta.tag':B('Recrutamento de tester','Tester recruitment'),
 'beta.h':B('Feita por 2 gajos em 25 minutos.','Built by 2 guys in 25 minutes.'),

pad.addEventListener('pointerdown',e=>{e.preventDefault();if(scanT)return;pad.classList.add('hot');buzz(15);prog=0;statusDefault=false;
  scanT=setInterval(()=>{prog+=2;ring.style.setProperty('--cut',(100-prog)+'%');status.textContent=L(TX.steps[Math.min(4,Math.floor(prog/22))]);if(prog%25===0)buzz(10);

$('#d-ok').onclick=()=>{buzz(30);dareJudge(true)};$('#d-fail').onclick=()=>{buzz(30);dareJudge(false)};

/* rounds engine: ~25 minutes */
const ROUNDS=['reflex','guess','dare','chal','guess','dare','chal','reflex'];
function nextRound(){if(G.ri>=ROUNDS.length)return gameFinal();const r=ROUNDS[G.ri++];G.round=G.ri;({reflex:reflexStart,guess:guessStart,chal:chalStart,dare:dareStart})[r]()}
function gameStart(){G.ri=0;G.round=0;G.d=null;nextRound()}

/* round 3: challenge */
const CH=[
 B('Mímica: elétrico 28 à hora de ponta','Mime: tram 28 at rush hour'),B('Mímica: segurança do Lux às 6h','Mime: Lux bouncer at 6am'),B('Mímica: DJ que perdeu a pen','Mime: DJ who lost the USB stick'),B('Mímica: táxi que não para no Cais do Sodré','Mime: taxi that won\'t stop at Cais do Sodré'),
 B('Mímica: sardinha na brasa','Mime: sardine on the grill'),B('Mímica: metro fechado às 2h','Mime: metro closed at 2am'),B('Mímica: pessoa a fingir que atende o telemóvel na pista','Mime: person fake-answering the phone on the dance floor'),
 B('Desafio: fazer o outro rir em 20 s sem falar','Challenge: make the other laugh in 20 s without talking'),B('Desafio: descrever o Lux só com sons','Challenge: describe Lux using only sounds'),B('Desafio: dança sincronizada de 10 s, inventada agora','Challenge: 10 s synchronized dance, invented now'),
 B('Mímica: pastel de nata a sair do forno','Mime: pastel de nata leaving the oven'),B('Mímica: turista perdido em Alfama com mapa de papel','Mime: tourist lost in Alfama with a paper map'),B('Mímica: gaivota a roubar uma sandes','Mime: seagull stealing a sandwich'),B('Mímica: fila do bar às 4h','Mime: bar queue at 4am'),
 B('Desafio: recitar um poema de 4 versos sobre a imperial morna','Challenge: recite a 4-line poem about warm beer'),B('Desafio: vender a bicicleta ao júri como se fosse um carro de luxo','Challenge: pitch the bike to the jury like it is a luxury car'),B('Desafio: fazer a voz de GPS a dar direções para o bar','Challenge: do a GPS voice giving directions to the bar'),
 B('Desafio: cantarolar uma música com a boca fechada, o par adivinha','Challenge: hum a song with mouth closed, partner guesses'),B('Desafio: contar uma história de 20 s em que tudo corre bem (impossível)','Challenge: tell a 20 s story where everything goes well (impossible)'),B('Desafio: imitar o segurança a recusar a entrada a um pombo','Challenge: impersonate the bouncer denying entry to a pigeon'),
 B('Desafio: pose de estátua de Lisboa, o outro adivinha qual','Challenge: pose as a Lisbon statue, the other guesses which'),B('Desafio: convencer o júri de que conhecem o DJ, 20 s','Challenge: convince the jury you know the DJ, 20 s'),
];
function chalStart(){G.ch={i:0,timer:null,left:20,used:G.ch?G.ch.used:[]};chalStep()}
function chalStep(){const c=G.ch;if(c.i>=G.teams.length)return nextRound();const ti=c.i,t=G.teams[ti];const pool=CH.filter(x=>!c.used.includes(x));c.word=rnd(pool);c.used.push(c.word);c.left=20;
  const jury=G.judge!==null?pname(G.players[G.judge]):tname(G.teams[1-ti]);
  const w=$('#ch-who');w.textContent=L(TX.chWho).replace('{t}',tname(t)).replace('{j}',jury);w.className='who '+G.players[t[0]].g;
  const wd=$('#ch-word');wd.textContent=L(c.word);wd.classList.remove('show');$('#ch-timer').hidden=true;$('#ch-timer').textContent='20';$('#ch-ctl').hidden=false;$('#ch-judge').hidden=true;$('#ch-start').disabled=true;
  $('#ch-title').textContent=L(TX.chTitle);$('#ch-hint').textContent=L(TX.chHint);go('s-chal')}
$('#ch-reveal').onclick=()=>{const wd=$('#ch-word');wd.classList.add('show');buzz(20);setTimeout(()=>{wd.classList.remove('show');$('#ch-start').disabled=false},3000)};
$('#ch-start').onclick=()=>{const c=G.ch;$('#ch-ctl').hidden=true;$('#ch-timer').hidden=false;$('#ch-title').textContent=L(TX.chGo);buzz(60);
  c.timer=setInterval(()=>{c.left--;$('#ch-timer').textContent=c.left;if(c.left<=5)buzz(20);if(c.left<=0){clearInterval(c.timer);$('#ch-title').textContent=L(TX.chTime);$('#ch-word').classList.add('show');$('#ch-judge').hidden=false;buzz([80,40,80])}},1000)};
function chalJudge(ok){const c=G.ch;clearInterval(c.timer);const ti=c.i;if(ok)G.score[ti]++;c.i++;
  showScore(L(ok?TX.chOk:TX.chFail).replace('{t}',tname(G.teams[ti])),L(TX.chWas).replace('{w}','<b style="color:var(--d)">'+L(c.word)+'</b>'),()=>chalStep())}
$('#ch-ok').onclick=()=>{buzz(30);chalJudge(true)};$('#ch-fail').onclick=()=>{buzz(30);chalJudge(false)};

/* final: the bike */
function gameFinal(){const mx=Math.max(...G.score);const ws=G.score.map((s,i)=>s===mx?i:-1).filter(i=>i>=0);G.winner=ws.length===1?ws[0]:null;
  $('#f-title').textContent=G.winner===null?L(TX.fTie):L(TX.fWin).replace('{t}',tname(G.teams[G.winner]));
  let prize=L(rnd(TX.fPrize));if(G.judge!==null&&G.winner!==null)prize+=' '+L(TX.fJudge).replace('{j}',pname(G.players[G.judge]));if(G.winner===null&&G.mode==='duel')prize+=' '+L(TX.duoTie);
  $('#f-prize').textContent=prize;finalCastigo();confetti();buzz([60,40,60,40,150]);go('s-final')}
function finalCastigo(){const losers=G.winner===null?G.teams.flat():G.teams.filter((t,i)=>i!==G.winner).flat();const allF=losers.every(i=>G.players[i].g==='f');
  const lv=G.winner===null||allF?1:rnd([1,2,3]);const pick=rnd(C[lv]);
  $('#f-cwho').textContent=G.winner===null?L(TX.fCwhoTie):L(TX.fCwho).replace('{t}',losers.map(i=>pname(G.players[i])).join(' + '));
  $('#f-ctext').innerHTML=`<b>${L(pick[0])}</b><br><span class="small">${L(pick[1])}</span>`;$('#f-note').textContent=L(allF?TX.fNote:TX.fNoteM)}
$('#f-again').onclick=()=>{buzz(20);finalCastigo()};
$('#f-rematch').onclick=()=>{buzz(20);G.score=G.teams.map(()=>0);gameStart()};
$('#f-prize2').onclick=()=>{buzz(20);$('#f-prize').textContent=L(rnd(TX.fPrize))};

/* confetti */
const cv=$('#fx'),cx=cv.getContext('2d');let ps=[];
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;cv.width=innerWidth;cv.height=innerHeight;const cols=['#FF4FA3','#C9FF3A','#5EE3FF','#FFC63A','#FFF4DC','#FF6A00'];
  for(let i=0;i<140;i++)ps.push({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,r:4+Math.random()*6,c:rnd(cols),a:Math.random()*6,s:(Math.random()-.5)*.3,l:90+Math.random()*40});
  if(!confetti.run){confetti.run=true;tick()}}
function tick(){cx.clearRect(0,0,cv.width,cv.height);ps=ps.filter(p=>p.l>0);ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.vx*=.98;p.a+=p.s;p.l--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.l/30);cx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);cx.restore()});
  if(ps.length)requestAnimationFrame(tick);else{confetti.run=false;cx.clearRect(0,0,cv.width,cv.height)}}

document.addEventListener('contextmenu',e=>{if(e.target.closest('.pad'))e.preventDefault()});
reset();applyI();
</script>
