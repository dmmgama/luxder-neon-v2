const bags=new Map();
function drawIds(key,length,count){let bag=bags.get(key)||[];const result=[];while(result.length<count){if(!bag.length){bag=Array.from({length},(_,i)=>i);for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}const index=bag.findIndex(id=>!result.includes(id));if(index<0){bag=[];continue}result.push(bag.splice(index,1)[0]);}bags.set(key,bag);return result;}

function grillEndView(){return `${back()}${modeArt('grill')}${heading('Investigação concluída.<br>Rigor duvidoso.','Investigation complete.<br>Questionable rigour.')}<div class="stack">${grill.paths.map((path,i)=>`<div class="dossier"><div class="caption">${name(i)} → ${name(1-i)}</div><p>${path.length===5?t(path.filter(x=>x===0).length>=3?'Detetive do improviso. Vê aventuras onde os outros veem uma fila.':'Detetive do plano B. Já reservou uma mesa para o pato.',path.filter(x=>x===0).length>=3?'Improvisation detective. Sees adventures where others see a queue.':'Plan B detective. Already booked a table for the duck.'):t('Dossier reservado. Privacidade impecável.','Sealed dossier. Excellent privacy.')}</p><small>${path.length}/5 ${t('escolhas · nenhum diagnóstico real','choices · no real diagnosis')}</small></div>`).join('')}</div><p class="privacy">${t('Nenhuma resposta tinha de ser justificada. Nenhuma destas teorias é ciência.','No answer needed a justification. None of these theories are science.')}</p><div class="stack">${btn('Outro dossier','Another dossier','grill-begin')}${btn('Prémio para os detetives 🚲','A prize for the detectives 🚲','social-prize','','secondary')}${btn('Outro modo','Another mode','modes','','secondary')}</div>`}
let glitchClicks=0,glitchNext=7,glitchOpen=false;
function showGlitch(){if(glitchOpen)return;glitchOpen=true;const host=document.createElement('div');host.id='glitch-layer';host.className='glitch-layer';host.innerHTML=`<div class="glitch-card" role="dialog" aria-modal="true" aria-labelledby="glitch-title"><div class="caption">ERROR 404 · ${t('competência não encontrada','competence not found')}</div><div class="glitch-face" aria-hidden="true">×_×</div><h2 id="glitch-title">${t('App bloqueada.','App blocked.')}</h2><p>${t('Os dois patetas que a fizeram não percebem nada disto.','The two idiots who made it have no idea what they are doing.')}</p><small>${t('É só uma piada. O jogo está exatamente onde o deixaste.','Just a joke. Your game is exactly where you left it.')}</small><button class="btn" data-action="glitch-close">${t('Desbloquear os patetas ↗','Unblock the idiots ↗')}</button></div>`;document.body.append(host);document.querySelector('.shell').inert=true;host.querySelector('button').focus();}
function closeGlitch(){document.querySelector('#glitch-layer')?.remove();document.querySelector('.shell').inert=false;glitchOpen=false;document.querySelector('#app button')?.focus({preventScroll:true})}
document.addEventListener('click',e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;if(action==='glitch-close'){closeGlitch();return}if(['grill-tap','quiz-answer','answer','convince-rate'].includes(action)){glitchClicks++;if(glitchClicks>=glitchNext&&!running&&!wheel.spinning){glitchNext=glitchClicks+10+Math.floor(Math.random()*9);showGlitch()}}});
document.addEventListener('keydown',e=>{if(glitchOpen&&(e.key==='Escape'||e.key==='Enter')){e.preventDefault();closeGlitch()}if(glitchOpen&&e.key==='Tab'){e.preventDefault();document.querySelector('#glitch-layer button')?.focus()}});

render();
</script>
</body>
</html>
