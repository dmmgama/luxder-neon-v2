function voteView(){const who=game.voter;if(!game.voteReady)return `${back()}${scorebar()}${eyebrow('Voto secreto · '+(who+1)+' / '+setup.count,'Secret vote · '+(who+1)+' / '+setup.count)}${heading('Quem te fez rir mais?','Who made you laugh most?')}<div class="result-card"><div class="result-icon">🗳️</div><h2>${name(who)}</h2><p class="copy">${t('Só tu vês o próximo ecrã. Passa o telefone depois de votar.','Only you see the next screen. Pass the phone after voting.')}</p></div>${btn('Votar em segredo','Vote in secret','vote-ready')}`;return `${back()}${eyebrow('A votar: '+name(who),'Voting: '+name(who))}${heading('O meu voto vai para…','My vote goes to…')}<p class="sub">${t('Vale votar em ti. A falta de vergonha é democrática.','Self-votes count. Shamelessness is democratic.')}</p><div class="options">${game.units.map((u,i)=>opt('★',teamName(u),teamName(u),'cast-vote',i)).join('')}</div>`}
function finishVote(){const totals=game.units.map(()=>0);game.votes.forEach((v,i)=>{const team=game.units.find(u=>u.members.includes(i));totals[v]+=1/team.members.length});const max=Math.max(...totals);game.lastWinners=totals.map((n,i)=>Math.abs(n-max)<1e-8?i:-1).filter(i=>i>=0);game.lastWinners.forEach(i=>game.units[i].score++);go('round-result');celebrate()}
function prizeView(){const isGame=!!game;let winners=isGame?game.units.filter(u=>u.score===Math.max(...game.units.map(x=>x.score))):[];let title=isGame?winners.map(teamName).join(' & '):prizeOwner==='quiz'?t('As duas cobaias','Both volunteers'):t('A tester','The tester');return `${back()}${isGame?scorebar():''}${eyebrow('Grande prémio · pequeno orçamento','Grand prize · tiny budget')}${heading('Ganharam uma<br>bicicleta.','You won<br>a bicycle.')}<div class="prize"><div class="caption">${t('Certificado oficialíssimo','Extremely official certificate')}</div>${bike}<h2>${esc(title)}</h2><p class="copy">${t('Duas rodas. Zero travões para o ego.','Two wheels. No brakes for the ego.')}</p><p class="tagline">${isGame&&winners.length>1?t('Empate: partilhem a bicicleta. Um pedala, o outro dá palpites.','Tie: share the bike. One pedals, the other gives advice.'):t('O pódio é vosso. A ciclovia também.','The podium is yours. So is the cycle lane.')}</p></div><p class="sub">${t('🚲 É esta. A bicicleta é virtual.<br>O momento de glória é todo vosso.','🚲 This is it. The bicycle is virtual.<br>The moment of glory is all yours.')}</p><div class="stack">${isGame?btn('Revanche ↗','Rematch ↗','start-game'):btn('Jogo · 2–4 pessoas','Game · 2–4 players','setup')}${btn('Voltar para a noite ✌','Back to the night ✌','leave','','secondary')}</div>${privacy()}`}
function startTimer(){if(running)return;running=true;clockEnd=Date.now()+remaining*1000;render();timer=setInterval(()=>{remaining=Math.max(0,Math.ceil((clockEnd-Date.now())/1000));const el=$('#timer'),p=$('#progress');if(el)el.textContent=remaining;if(p)p.style.width=(remaining/8*100)+'%';if(remaining===0){clearClock();buzz();render()}},100)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action,v=b.dataset.value; buzz();switch(action){
case 'lang':lang=v;render();break;
case 'home':quiz={turn:0,q:0,answers:[[],[]]};tester={choice:0,bugs:0,duo:[],penalty:0};game=null;go('home');break;
case 'leave':quiz={turn:0,q:0,answers:[[],[]]};game=null;tester={choice:0,bugs:0,duo:[],penalty:0};go('leave');break;
case 'no':go('no');break;
case 'test':tester={choice:0,bugs:0,duo:[],penalty:0};go('test');break;
case 'animal':tester.choice=Number(v);go('verdict');break;
case 'approved':go('approved');celebrate();break;
case 'penalty':tester.bugs++;tester.penalty=(tester.penalty+1+Math.floor(Math.random()*2))%3;go('penalty');break;
case 'report':go('report');break;
case 'tester-prize':prizeOwner='tester';game=null;go('prize');celebrate();break;
case 'duo':case 'quiz-start':quiz={turn:0,q:0,answers:[[],[]]};go('quiz-handoff');break;
case 'quiz-ready':go('quiz');break;
case 'quiz-answer':quiz.answers[quiz.turn].push(Number(v));quiz.q++;if(quiz.q===3){quiz.q=0;quiz.turn++;go(quiz.turn===2?'quiz-result':'quiz-handoff');if(quiz.turn===2)celebrate()}else go('quiz');break;
case 'quiz-prize':prizeOwner='quiz';game=null;go('prize');celebrate();break;
case 'duo-pick':tester.duo.push(Number(v));go(tester.duo.length===2?'duo-result':'duo');break;
case 'setup':go('setup');break;
case 'count':setup.count=Number(v);setup.format='solo';setup.solo=0;render();break;
case 'gender':{const [i,g]=v.split(':');setup.genders[+i]=g;render();break}
case 'format':setup.format=v;render();break;
case 'solo':setup.solo=Number(v);render();break;
case 'pair':setup.pair=Number(v);render();break;
case 'length':setup.length=Number(v);render();break;
case 'start-game':startGame();break;
case 'question':go('question');break;
case 'answer':game.answers.push(Number(v));game.turn++;go(game.turn<game.units.length?'handoff':'reveal');break;
case 'vote-start':game.voter=0;game.votes=[];game.voteReady=false;go('vote');break;
case 'vote-ready':game.voteReady=true;render();break;
case 'cast-vote':game.votes.push(Number(v));game.voter++;game.voteReady=false;if(game.voter===setup.count)finishVote();else go('vote');break;
case 'next-round':game.round++;game.turn=0;game.delegated=[];remaining=8;if(game.round>=game.rounds){go('prize');celebrate()}else go('challenge');break;
case 'timer':startTimer();break;
case 'delegate':game.delegated[game.turn]=true;render();break;
case 'challenge-done':clearClock();game.turn++;remaining=8;if(game.turn<game.units.length)go('challenge');else{game.voter=0;game.votes=[];game.voteReady=false;go('vote')}break;
}});
render();
</script>
</body>
</html>
